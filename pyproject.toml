[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raft-consensus-simulator"
version = "0.1.0"
description = "A from-scratch, in-process discrete-event simulator for the Raft consensus algorithm, with injectable network partitions/delays/crashes and randomized safety-property tests."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0"]

[project.scripts]
raftsim = "raft.cli:main"

[tool.setuptools]
packages = ["raft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
